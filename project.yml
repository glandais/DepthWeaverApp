name: iStereogram
options:
  bundleIdPrefix: com.glandais
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  defaultLocalization: en

targets:
  iStereogram:
    type: application
    platform: iOS
    sources:
      - iStereogram
    settings:
      base:
        INFOPLIST_KEY_NSCameraUsageDescription: "iStereogram uses the camera with LiDAR to capture 3D depth"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "iStereogram needs access to your photos to generate depth maps"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "iStereogram saves generated stereograms to your photo library"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIRequiresFullScreen: false
        GENERATE_INFOPLIST_FILE: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.glandais.iStereogram
        DEVELOPMENT_TEAM: "7Q49262697"
